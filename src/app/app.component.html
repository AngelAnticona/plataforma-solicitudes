<h1>Plataforma de Gestión de Solicitudes Académicas</h1>

<h2>Solicitudes registradas</h2>

<ul>
  <li *ngFor="let solicitud of solicitudes">
    <strong>{{ solicitud.titulo }}</strong>
    <br>
    Tipo: {{ solicitud.tipo }}
    <br>
    Estado: {{ solicitud.estado }}
    <br>
    Fecha: {{ solicitud.fechaCreacion }}
  </li>
</ul>

<h2>Solicitudes pendientes</h2>

<ul>
  <li *ngFor="let solicitud of solicitudesPendientes">
    {{ solicitud.titulo }} - {{ solicitud.estado }}
  </li>
</ul>
